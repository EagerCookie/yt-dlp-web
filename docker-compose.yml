services:
  yt-dlp-web:
    build: .
    ports:
      - "8000:8000"     # Web UI + API
      - "1704:1704"     # SnapCast audio stream
      - "1705:1705"     # SnapCast control (JSON-RPC)
      - "1780:1780"     # snapweb HTTP
    volumes:
      - downloads:/downloads
      - db_data:/data
    environment:
      - DOWNLOAD_DIR=/downloads
      - DB_PATH=/data/downloads.db
      - MAX_CONCURRENT_DOWNLOADS=3
      - CLEANUP_AFTER_HOURS=24
      - UPDATE_YTDLP_ON_START=true
    restart: unless-stopped

volumes:
  downloads:
  db_data:
